# Render Blueprint — one free web service built from the root Dockerfile.
# Set the three secret env vars in the Render dashboard (they are marked sync:false).
services:
  - type: web
    name: sub130
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI       # from MongoDB Atlas (mongodb+srv://...)
        sync: false
      - key: APP_USERNAME      # your login name
        sync: false
      - key: APP_PASSWORD      # your login password (enables auth)
        sync: false
